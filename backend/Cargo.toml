[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
diesel = {version  = "2.3.6" , features = ["postgres"]}
dotenv = "0.15.0"
reqwest = "0.13.1"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
solana-client = "3.1.8"
solana-commitment-config = "3.1.0"
solana-sdk = "3.0.0"
tokio = {version = "1.49.0", features = ["full"]}
anchor-client = { version = "0.32.1", features = ["async"] }
anchor-lang = "0.32.1"
anyhow = "1.0.93"
solana-signer = "=2.2.1"
contract = {path = "../contract/programs/contract/", features = ["no-entrypoint"]}
