services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    env_file:
      - backend/.env
    expose:
      - "4000"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
